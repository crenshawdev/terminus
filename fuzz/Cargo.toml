# Fuzz targets for every parser that reads input from outside Terminus.
# Build them all with `cargo +nightly fuzz build` from the repo root; run one
# with `cargo +nightly fuzz run <target>`.
[package]
name = "terminus-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# A workspace of its own, so the root workspace never builds it.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
tempfile = "3"
terminus = { path = "../crates/terminus" }
terminus-core = { path = "../crates/terminus-core" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "jsonl_scan"
path = "fuzz_targets/jsonl_scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "index_record"
path = "fuzz_targets/index_record.rs"
test = false
doc = false
bench = false

