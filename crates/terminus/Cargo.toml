[package]
name = "terminus"
description = "Persistent, cross-session memory for Claude Code."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# The binary's code is a library so the fuzz targets in `fuzz/` can call its
# parsers. Doc comments here are prose, never doctests.
[lib]
path = "src/lib.rs"
doctest = false

# `doc = false`: the library and the binary share the name, and documenting both
# would collide.
[[bin]]
name = "terminus"
path = "src/main.rs"
doc = false

[lints.rust]
# `cargo fuzz` sets `cfg(fuzzing)`; `lib.rs` uses it to compile the fuzz entry
# points only into fuzz builds.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[features]
default = []
# Builds the binary with `terminus-core`'s fault-injection points compiled in.
# The crash harness spawns this binary and needs a kill to land *inside* the
# ingest transaction; without this the points are inert and a release pass over
# a small fixture commits before any kill can arrive. Never enabled for a
# release build of the shipped binary.
testkit = ["terminus-core/testkit"]

[dependencies]
terminus-core.workspace = true
lexopt.workspace = true
# D-25: the `--json` contract is emitted with serde_json named here rather than
# hand-formatted with `format!`. It adds no newly compiled crate - `terminus-core`
# already depends on it, so it is already linked into this binary - and escaping
# an excerpt holding quotes, backslashes or control bytes is exactly where a
# hand-rolled writer fails, on the turns most worth reading.
serde_json.workspace = true

# The binary picks the allocator, so this lives here and not in terminus-core.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
# The binary tests need the fixture corpus and the seeded Rng the library's
# testkit already owns; a `tests/common` module duplicated per test binary was
# the alternative (`.planning/phases/1/PLAN-1.md`, task 2).
terminus-core = { workspace = true, features = ["testkit"] }
rusqlite.workspace = true
tempfile = "3"
