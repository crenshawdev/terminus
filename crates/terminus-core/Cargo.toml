[package]
name = "terminus-core"
description = "Terminus archive core: store, block-framed blobs, ingest."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# Test-support code (fixture paths, temp-store helpers). Off by default so none
# of it is compiled into the shipped binary.
testkit = []

[dependencies]
rusqlite.workspace = true
zstd.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
ureq.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Real temp directories for real SQLite databases; never a mock
# (DESIGN-BRIEF.md:504). A dev-dependency rather than a `testkit` dependency so
# tests that need a temp dir but no fixture need no cargo feature.
tempfile = "3"
