[package]
name = "terminus-core"
description = "Terminus archive core: store, block rows, ingest."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# Test-support code (fixture paths, temp-store helpers). Off by default so none
# of it is compiled into the shipped binary.
testkit = []

[dependencies]
rusqlite.workspace = true
zstd.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Real temp directories for real SQLite databases; never a mock
# (DESIGN-BRIEF.md:504). A dev-dependency rather than a `testkit` dependency so
# tests that need a temp dir but no fixture need no cargo feature.
tempfile = "3"

# Test files gated as a whole on `testkit`. Declaring them makes
# `cargo test --test <name>` without the feature fail and name `testkit`,
# instead of passing with zero tests (#44). A package-wide `cargo test -p` still
# skips them without a word, so run the suite with `--all-features`.

[[test]]
name = "backfill"
path = "tests/backfill.rs"
required-features = ["testkit"]

[[test]]
name = "capture"
path = "tests/capture.rs"
required-features = ["testkit"]

[[test]]
name = "compaction"
path = "tests/compaction.rs"
required-features = ["testkit"]

